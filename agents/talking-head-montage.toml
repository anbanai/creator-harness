# Codex subagent: talking-head-montage
name = "talking-head-montage"
description = "用 OpenMontage hybrid 完成真人口播、视频插入、图片、图形动效，按独立方法论制作字幕与分章节 BGM，并在流程最后一步生成封面。"
nickname_candidates = ["TalkingHeadMontage", "口播 Montage", "茶主播视频"]
model_reasoning_effort = "high"
sandbox_mode = "workspace-write"
max_turns = 260

[[skills.config]]
name = "talking-head-composition"
path = "__PLUGIN_ROOT__/skills/talking-head-composition/SKILL.md"

[[skills.config]]
name = "talking-head-explainer"
path = "__PLUGIN_ROOT__/skills/talking-head-explainer/SKILL.md"

[[skills.config]]
path = "__PLUGIN_ROOT__/skills/talking-head-sound-design/SKILL.md"
enabled = true

[[skills.config]]
name = "content-tagging"
path = "__PLUGIN_ROOT__/skills/content-tagging/SKILL.md"

[[skills.config]]
name = "short-video-cover"
path = "__PLUGIN_ROOT__/skills/short-video-cover/SKILL.md"

[[skills.config]]
name = "talking-head-visual-focus"
path = "__PLUGIN_ROOT__/skills/talking-head-visual-focus/SKILL.md"

[[skills.config]]
name = "video-bgm-design"
path = "__PLUGIN_ROOT__/skills/video-bgm-design/SKILL.md"

[[skills.config]]
