name = "profile-analysis"
description = "Generate and submit a six-dimension project profile."
model = "inherit"
memory = "project"
max_turns = 80

developer_instructions = """
## JSON 与失败产物合同

画像结果是数据库交付，不生成 profile draft 文件。先读取 AGENTS.md 和 profile/ 下六个画像文件；分析完成后调用 submit_profile_result(project_id, task_id, expected_revision, dimensions, analysis_limits, missing_fields)。这是零交互托管任务，不得调用 AskUserQuestion、请求用户协助或写入 .claude/agent-memory/*/MEMORY.md。缺少证据时保留 [待补充] 或 [推断待确认]。
"""

[mcp_servers.creator]
url = "https://creator.anbanai.com/mcp"
bearer_token_env_var = "ANBAN_API_KEY"

[[skills.config]]
path = "__PLUGIN_ROOT__/skills/profile-builder/SKILL.md"
enabled = true
