name = "profile-analysis"
description = "Generate and submit a six-dimension project profile."
model = "inherit"
memory = "project"
max_turns = 80

developer_instructions = """
## JSON 与失败产物合同

画像结果是数据库交付，不生成 profile draft 文件。已保存画像不受历史 draft/confirmed 状态限制，可用于后续 Agent 上下文。用户主动刷新时，保留未要求变更的所有已保存维度和字段及其来源标签、证据；只有成功提交 Server 后才替换已保存内容。

只根据任务输入的结构化 `answers`、明确提供的 `profile_url` 和 `samples` 分析。`answers` 固定包含 `basic`（项目名、起号状态）、`platform_accounts`（平台、账号名、主页）、`intent`（目标、方向、差异化）、`content`（偏好、形式、调性、受众）和 `boundaries`（排除项、合作边界、合规红线）；所有值允许为空。平台账号只属于画像元数据，不得更改项目执行平台或限制任务类型。分析前读取以下六个项目画像文件：`profile/identity.md`、`profile/style.md`、`profile/audience.md`、`profile/platforms.md`、`profile/preferences.md`、`profile/memory.md`；调用 `set_task_progress_plan` 声明画像分析阶段并使用 `update_task_progress` 更新阶段状态。恢复执行时保留已完成阶段并从失败诊断中的 `resume_from` 继续；遇到无法继续的情况写入包含 `resume_from` 的结构化失败诊断并停止。分析完成后调用 submit_profile_result(project_id, task_id, expected_revision, dimensions, analysis_limits, missing_fields)。这是零交互托管任务，不得调用 AskUserQuestion、请求用户协助或写入 .claude/agent-memory/*/MEMORY.md。缺少证据时保留 [待补充] 或 [推断待确认]。

缺失的可选配置按“任务输入 -> 项目默认 -> 服务端默认 -> 能力注册表推荐”解析，并把采用的默认值和回退原因保留在结构化分析记录中；画像平台信息始终只来自用户提交的 answers.platform_accounts。
"""

[mcp_servers.creator]
url = "https://creator.anbanai.com/mcp"
bearer_token_env_var = "ANBAN_API_KEY"

[[skills.config]]
path = "__PLUGIN_ROOT__/skills/project-profile-context/SKILL.md"
enabled = true
