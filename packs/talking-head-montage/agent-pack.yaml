id: talking-head-montage
version: 1.3.0
kind: plugin
display_name: 口播 Montage 制作
description: 以 OpenMontage hybrid 为主引擎，完成真人口播、生成视频素材、图片素材、图形动效、字幕与分章节 BGM 的本地制作与文件审核，并在流程最后一步生成封面。
interaction:
  user_questions: false
agent:
  name: talking-head-montage
  claude_source: agent.claude.md
  codex_source: agent.codex.toml
  skills: [talking-head-video-generation, talking-head-composition, talking-head-sound-design, content-tagging, short-video-cover, talking-head-visual-focus, talking-head-explainer, video-bgm-design, video-production-qc, video-subtitle-design]
  max_turns: 260
runtime:
  profile: talking-head-montage
  adapter: openmontage
bindings: {}
surfaces: [plugin]
features: [talking-head, explainable-knowledge-editing, semantic-master-variants, retention-experiments, independent-validation, generated-video-inserts, image-inserts, motion-graphics, automatic-review-loop]
artifacts:
  - {role: explainer_input_assessment, path: output/explainer-input-assessment.json, mime_type: application/json, required: false}
  - {role: semantic_master, path: output/semantic-master.json, mime_type: application/json, required: false}
  - {role: explanation_rehearsal, path: output/explanation-rehearsal.json, mime_type: application/json, required: false}
  - {role: explanation_plan, path: output/explanation-plan.json, mime_type: application/json, required: false}
  - {role: platform_variant_plan, path: output/platform-variant-plan.json, mime_type: application/json, required: false}
  - {role: retention_experiment_plan, path: output/retention-experiment-plan.json, mime_type: application/json, required: false}
  - {role: independent_validation_plan, path: output/independent-validation-plan.json, mime_type: application/json, required: false}
  - {role: independent_validation, path: output/independent-validation.json, mime_type: application/json, required: false}
  - {role: retention_results, path: output/retention-results.json, mime_type: application/json, required: false}
  - {role: rough_cut, path: output/rough-cut.mp4, mime_type: video/mp4, required: true}
  - {role: semantic_cut, path: output/semantic-cut.mp4, mime_type: video/mp4, required: true}
  - {role: transcript, path: output/transcript.json, mime_type: application/json, required: true}
  - {role: edit_decision_list, path: output/edit-decision-list.json, mime_type: application/json, required: true}
  - {role: edit_strategy, path: output/edit-strategy.md, mime_type: text/markdown, required: true}
  - {role: asset_requirements, path: output/asset-requirements.json, mime_type: application/json, required: true}
  - {role: visual_plan_draft, path: output/visual-plan-draft.json, mime_type: application/json, required: true}
  - {role: asset_source_policy, path: output/asset-source-policy.json, mime_type: application/json, required: true}
  - {role: generated_video_manifest, path: output/generated-video-manifest.json, mime_type: application/json, required: true}
  - {role: generated_video_review, path: output/generated-video-review.json, mime_type: application/json, required: true}
  - {role: generated_video_lint, path: output/generated-video-lint.json, mime_type: application/json, required: true}
  - {role: asset_source_manifest, path: output/asset-source-manifest.json, mime_type: application/json, required: true}
  - {role: visual_plan, path: output/visual-plan.json, mime_type: application/json, required: true}
  - {role: asset_ledger, path: output/asset-ledger.json, mime_type: application/json, required: true}
  - {role: composition_plan, path: output/composition-plan.json, mime_type: application/json, required: true}
  - {role: composition_lint, path: output/composition-lint.json, mime_type: application/json, required: true}
  - {role: motion_sample, path: output/motion-sample.mp4, mime_type: video/mp4, required: true}
  - {role: motion_review, path: output/motion-review.json, mime_type: application/json, required: true}
  - {role: motion_source_manifest, path: output/motion-source-manifest.json, mime_type: application/json, required: true}
  - {role: captions, path: output/captions.srt, mime_type: text/plain, required: true}
  - {role: caption_plan, path: output/caption-plan.md, mime_type: text/markdown, required: true}
  - {role: caption_style, path: output/caption-style.json, mime_type: application/json, required: true}
  - {role: caption_qc, path: output/caption-qc.json, mime_type: application/json, required: true}
  - {role: final_picture, path: output/final-picture.mp4, mime_type: video/mp4, required: true}
  - {role: final_video, path: output/final.mp4, mime_type: video/mp4, required: true}
  - {role: final_audio_transcript, path: output/final-audio-transcript.json, mime_type: application/json, required: true}
  - {role: sfx_cues, path: output/sfx-cues.json, mime_type: application/json, required: true}
  - {role: bgm_plan, path: output/bgm-plan.json, mime_type: application/json, required: true}
  - {role: bgm_plan_md, path: output/bgm-plan.md, mime_type: text/markdown, required: true}
  - {role: bgm_qc, path: output/bgm-qc.json, mime_type: application/json, required: true}
  - {role: audio_source_manifest, path: output/audio-source-manifest.json, mime_type: application/json, required: true}
  - {role: content_tags, path: output/content-tags.json, mime_type: application/json, required: true}
  - {role: delivery_manifest, path: output/delivery-manifest.json, mime_type: application/json, required: true}
  - {role: quality_evidence, path: output/quality-evidence.json, mime_type: application/json, required: true}
  - {role: sync_evidence, path: output/sync-evidence.json, mime_type: application/json, required: true}
  - {role: audio_content_check, path: output/audio-content-check.json, mime_type: application/json, required: true}
  - {role: cover_reference_input, path: output/input-manifest.md, mime_type: text/markdown, required: false}
  - {role: cover_reference_image, path: output/reference-cover.png, mime_type: image/png, required: false}
  - {role: cover_reference_compressed_image, path: output/reference-cover-compressed.png, mime_type: image/png, required: false}
  - {role: cover_reference_analysis, path: output/reference-analysis.md, mime_type: text/markdown, required: false}
  - {role: cover_plan, path: output/cover-plan.md, mime_type: text/markdown, required: true}
  - {role: cover, path: output/cover.png, mime_type: image/png, required: true}
  - {role: cover_quality, path: output/cover-quality.json, mime_type: application/json, required: true}
  - {role: cover_reference_prompts, path: output/cover-prompts.md, mime_type: text/markdown, required: false}
  - {role: cover_review, path: output/cover-review.md, mime_type: text/markdown, required: false}
  - {role: cover_candidate, path: output/cover_v2.png, mime_type: image/png, required: false}
  - {role: review_decision, path: output/review-decision.json, mime_type: application/json, required: false}
  - {role: failure_state, path: output/failure-state.json, mime_type: application/json, required: false}
  - {role: failure_diagnosis, path: output/failure-diagnosis.md, mime_type: text/markdown, required: false}
  - {role: progress_state, path: output/progress-state.json, mime_type: application/json, required: true}
artifact_stages:
  - id: motion_review
    trigger: output/motion-sample.mp4
    required:
      - output/rough-cut.mp4
      - output/transcript.json
      - output/edit-decision-list.json
      - output/edit-strategy.md
      - output/semantic-cut.mp4
      - output/asset-requirements.json
      - output/visual-plan-draft.json
      - output/asset-source-policy.json
      - output/generated-video-manifest.json
      - output/generated-video-review.json
      - output/generated-video-lint.json
      - output/asset-source-manifest.json
      - output/asset-ledger.json
      - output/visual-plan.json
      - output/composition-plan.json
      - output/composition-lint.json
      - output/motion-sample.mp4
      - output/motion-review.json
      - output/motion-source-manifest.json
  - id: final_delivery
    trigger: output/final.mp4
    terminal: true
    required:
      - output/edit-decision-list.json
      - output/composition-lint.json
      - output/final-audio-transcript.json
      - output/audio-content-check.json
      - output/sync-evidence.json
      - output/quality-evidence.json
      - output/generated-video-manifest.json
      - output/generated-video-review.json
      - output/generated-video-lint.json
      - output/progress-state.json
  - id: explainer_preflight
    trigger: output/explainer-input-assessment.json
    required:
      - output/explainer-input-assessment.json
      - output/semantic-master.json
      - output/explanation-plan.json
      - output/explanation-rehearsal.json
      - output/platform-variant-plan.json
      - output/retention-experiment-plan.json
      - output/independent-validation-plan.json
      - output/independent-validation.json
    required_on_final: true
delivery:
  - {role: explainer_input_assessment, path: output/explainer-input-assessment.json, mime_type: application/json}
  - {role: semantic_master, path: output/semantic-master.json, mime_type: application/json}
  - {role: explanation_plan, path: output/explanation-plan.json, mime_type: application/json}
  - {role: explanation_rehearsal, path: output/explanation-rehearsal.json, mime_type: application/json}
  - {role: platform_variant_plan, path: output/platform-variant-plan.json, mime_type: application/json}
  - {role: retention_experiment_plan, path: output/retention-experiment-plan.json, mime_type: application/json}
  - {role: independent_validation_plan, path: output/independent-validation-plan.json, mime_type: application/json}
  - {role: independent_validation, path: output/independent-validation.json, mime_type: application/json}
  - {role: retention_results, path: output/retention-results.json, mime_type: application/json}
  - {role: final_video, path: output/final.mp4, mime_type: video/mp4}
  - {role: final_audio_transcript, path: output/final-audio-transcript.json, mime_type: application/json}
  - {role: final_picture, path: output/final-picture.mp4, mime_type: video/mp4}
  - {role: sfx_cues, path: output/sfx-cues.json, mime_type: application/json}
  - {role: bgm_plan, path: output/bgm-plan.json, mime_type: application/json}
  - {role: bgm_plan_md, path: output/bgm-plan.md, mime_type: text/markdown}
  - {role: bgm_qc, path: output/bgm-qc.json, mime_type: application/json}
  - {role: audio_source_manifest, path: output/audio-source-manifest.json, mime_type: application/json}
  - {role: captions, path: output/captions.srt, mime_type: text/plain}
  - {role: caption_plan, path: output/caption-plan.md, mime_type: text/markdown}
  - {role: caption_style, path: output/caption-style.json, mime_type: application/json}
  - {role: caption_qc, path: output/caption-qc.json, mime_type: application/json}
  - {role: cover, path: output/cover.png, mime_type: image/png}
  - {role: cover_plan, path: output/cover-plan.md, mime_type: text/markdown}
  - {role: cover_quality, path: output/cover-quality.json, mime_type: application/json}
  - {role: content_tags, path: output/content-tags.json, mime_type: application/json}
  - {role: delivery_manifest, path: output/delivery-manifest.json, mime_type: application/json}
  - {role: quality_evidence, path: output/quality-evidence.json, mime_type: application/json}
  - {role: edit_decision_list, path: output/edit-decision-list.json, mime_type: application/json}
  - {role: generated_video_manifest, path: output/generated-video-manifest.json, mime_type: application/json}
  - {role: generated_video_review, path: output/generated-video-review.json, mime_type: application/json}
  - {role: generated_video_lint, path: output/generated-video-lint.json, mime_type: application/json}
  - {role: sync_evidence, path: output/sync-evidence.json, mime_type: application/json}
  - {role: audio_content_check, path: output/audio-content-check.json, mime_type: application/json}
  - {role: progress_state, path: output/progress-state.json, mime_type: application/json}
ui:
  renderer: custom:talking-head-montage
