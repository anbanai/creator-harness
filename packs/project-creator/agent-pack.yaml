id: project-creator
version: 1.0.3
kind: managed
display_name: 画像模式
description: 通过中文对话判断 Anban 项目适配性，选择内容类型并创建或更新六维项目画像。
agent:
  name: project-creator
  claude_source: agent.claude.md
  codex_source: agent.codex.toml
  dsh_source: agent.dsh.yml
  skills: [project-creator-client-discovery]
  max_turns: 120
interaction:
  user_questions: true
  capabilities: [ask_user_question, stage_project_creator_draft]
  intents: [create-project, update-project-profile]
runtime:
  profile: project-creator
  adapter: standard
  max_turns: 120
surfaces: [plugin]
features: [interactive-project-creation]
schemas:
  task_input: schemas/task-input.json
  output: schemas/output.json
ui:
  renderer: custom:project-creator
