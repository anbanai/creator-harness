bearer_token_env_var = "ANBAN_API_KEY"

[[skills.config]]
path = "__PLUGIN_ROOT__/skills/montage/SKILL.md"
enabled = true

[[skills.config]]
path = "__PLUGIN_ROOT__/skills/video-cover-design/SKILL.md"
enabled = true
