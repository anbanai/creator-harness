id: montage
version: 1.0.2
kind: managed
display_name: Montage 视频
description: 使用 OpenMontage 从素材和业务输入生产最终视频与交付清单。
agent:
  name: montage
  claude_source: agent.claude.md
  codex_source: agent.codex.toml
  skills: [montage, video-cover-design]
  max_turns: 180
bindings:
  project_platforms: [montage]
  task_types: [montage]
runtime:
  profile: montage
  adapter: openmontage
  max_turns: 40
surfaces: [plugin, project, task, plan]
features: [video-generation, source-assets]
billing_operations:
  montage: task.montage
progress:
  - {id: prepare, title: 准备 Montage 项目, active_percent: 5, complete_percent: 20}
  - {id: production, title: 视频生产, active_percent: 30, complete_percent: 85}
  - {id: delivery, title: 交付验收, active_percent: 90, complete_percent: 100, required_artifacts: [output/final.mp4, output/montage-project.json, output/cover.png, output/delivery-manifest.json]}
artifacts:
  - {role: final_video, path: output/final.mp4, mime_type: video/mp4, required: true}
  - {role: project_manifest, path: output/montage-project.json, mime_type: application/json, required: true}
  - {role: cover, path: output/cover.png, mime_type: image/png, required: true}
  - {role: delivery_manifest, path: output/delivery-manifest.json, mime_type: application/json, required: true}
delivery:
  - {role: final_video, path: output/final.mp4, mime_type: video/mp4}
  - {role: delivery_manifest, path: output/delivery-manifest.json, mime_type: application/json}
ui:
  renderer: custom:montage
