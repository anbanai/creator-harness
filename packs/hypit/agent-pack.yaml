id: hypit
version: 2.0.4
kind: managed
display_name: 视频复刻
description: 根据参考视频和替换要求生成成片，保留完整工程用于再次改编。
agent:
  name: hypit
  claude_source: agent.claude.md
  codex_source: agent.codex.toml
  skills: [portrait-cover-design]
  max_turns: 180
bindings:
  project_platforms: [hypit]
  task_types: [hypit]
runtime:
  profile: hypit
  adapter: standard
  max_turns: 180
surfaces: [plugin, project, task, plan]
features: [video-replication, source-assets, editable-video]
billing_operations:
  hypit: task.hypit
artifacts:
  - {role: final_video, path: output/final.mp4, mime_type: video/mp4, required: true}
  - {role: cover, path: output/cover.png, mime_type: image/png, required: true}
  - {role: project_manifest, path: output/project.json, mime_type: application/json, required: true}
  - {role: project_archive, path: output/project.zip, mime_type: application/zip, required: true}
  - {role: delivery_manifest, path: output/delivery-manifest.json, mime_type: application/json, required: true}
  - {role: quality_report, path: output/quality-report.json, mime_type: application/json, required: true}
  - {role: other, path: output/cover-plan.md, mime_type: text/markdown, required: false}
  - {role: other, path: output/cover-prompt.md, mime_type: text/markdown, required: false}
  - {role: review, path: output/cover-quality.json, mime_type: application/json, required: false}
  - {role: reference_media, path: output/reference-media.json, mime_type: application/json, required: false}
  - {role: semantic_report, path: output/semantic-report.json, mime_type: application/json, required: false}
  - {role: failure_diagnosis, path: output/failure-diagnosis.md, mime_type: text/markdown, required: false}
  - {role: failure_state, path: output/failure-state.json, mime_type: application/json, required: false}
  - {role: progress_state, path: output/progress-state.json, mime_type: application/json, required: false}
delivery:
  - {role: final_video, path: output/final.mp4, mime_type: video/mp4}
  - {role: cover, path: output/cover.png, mime_type: image/png}
  - {role: project_manifest, path: output/project.json, mime_type: application/json}
  - {role: project_archive, path: output/project.zip, mime_type: application/zip}
  - {role: delivery_manifest, path: output/delivery-manifest.json, mime_type: application/json}
  - {role: quality_report, path: output/quality-report.json, mime_type: application/json}
  - {role: other, path: output/cover-plan.md, mime_type: text/markdown}
  - {role: other, path: output/cover-prompt.md, mime_type: text/markdown}
  - {role: review, path: output/cover-quality.json, mime_type: application/json}
ui:
  renderer: custom:hypit
