id: viral-ip-video-editor
version: 1.0.5
kind: plugin
display_name: 爆款 IP 视频剪辑
description: 基于 Montage 运行时处理真人 IP 口播素材，完成留存导向的剪辑规划、制作指导和成片质量复核。
interaction:
  user_questions: false
agent:
  name: viral-ip-video-editor
  claude_source: agent.claude.md
  codex_source: agent.codex.toml
  skills: [content-reuse, content-tagging, montage, portrait-cover-design, viral-ip-editing, wechat-video-account-review]
  max_turns: 250
runtime:
  profile: viral-ip-video-editor
  adapter: openmontage
surfaces: [plugin]
features: [viral-ip-video-editing, retention-editing, source-assets, montage-runtime]
artifacts:
  - {role: project_brief, path: output/project_brief.md, mime_type: text/markdown, required: false}
  - {role: transcript, path: output/transcript.json, mime_type: application/json, required: false}
  - {role: content_map, path: output/content_map.md, mime_type: text/markdown, required: false}
  - {role: edit_master_plan, path: output/edit_master_plan.md, mime_type: text/markdown, required: false}
  - {role: plan_review, path: output/plan_review.md, mime_type: text/markdown, required: false}
  - {role: wechat_video_account_review, path: output/wechat-video-account-review.md, mime_type: text/markdown, required: false}
  - {role: wechat_video_account_review_json, path: output/wechat-video-account-review.json, mime_type: application/json, required: false}
  - {role: wechat_video_account_review_plan, path: output/wechat-video-account-review-plan.md, mime_type: text/markdown, required: false}
  - {role: wechat_video_account_review_plan_json, path: output/wechat-video-account-review-plan.json, mime_type: application/json, required: false}
  - {role: wechat_video_account_review_revision, path: output/wechat-video-account-review-revision-*.md, mime_type: text/markdown, required: false}
  - {role: wechat_video_account_review_revision_json, path: output/wechat-video-account-review-revision-*.json, mime_type: application/json, required: false}
  - {role: wechat_video_account_review_final, path: output/wechat-video-account-review-final-*.md, mime_type: text/markdown, required: false}
  - {role: wechat_video_account_review_final_json, path: output/wechat-video-account-review-final-*.json, mime_type: application/json, required: false}
  - {role: edit_decision_list, path: output/edit_decision_list.json, mime_type: application/json, required: false}
  - {role: visual_plan, path: output/visual_plan.json, mime_type: application/json, required: false}
  - {role: sfx_cues, path: output/sfx_cues.json, mime_type: application/json, required: false}
  - {role: bgm_plan, path: output/bgm_plan.json, mime_type: application/json, required: false}
  - {role: captions, path: output/captions.srt, mime_type: text/plain, required: false}
  - {role: qc_report, path: output/qc_report.md, mime_type: text/markdown, required: false}
  - {role: content_tags, path: output/content-tags.json, mime_type: application/json, required: false}
  - {role: final_video, path: output/final.mp4, mime_type: video/mp4, required: false}
  - {role: project_manifest, path: output/montage-project.json, mime_type: application/json, required: false}
  - {role: cover, path: output/cover.png, mime_type: image/png, required: false}
  - {role: delivery_manifest, path: output/delivery-manifest.json, mime_type: application/json, required: false}
  - {role: content_reuse_brief, path: output/content-reuse-brief.json, mime_type: application/json, required: false}
  - {role: content_lineage, path: output/content-lineage.json, mime_type: application/json, required: false}
  - {role: topic_analysis, path: output/topic-analysis.md, mime_type: text/markdown, required: false}
  - {role: quality_report, path: output/quality-report.json, mime_type: application/json, required: false}
  - {role: cover_plan, path: output/cover-plan.md, mime_type: text/markdown, required: false}
  - {role: cover_prompt, path: output/cover-prompt.md, mime_type: text/markdown, required: false}
  - {role: cover_reference_prompts, path: output/cover-prompts.md, mime_type: text/markdown, required: false}
  - {role: cover_review, path: output/cover-quality.json, mime_type: application/json, required: false}
  - {role: cover_reference_analysis, path: output/reference-analysis.md, mime_type: text/markdown, required: false}
  - {role: cover_reference_input, path: output/input-manifest.md, mime_type: text/markdown, required: false}
  - {role: cover_reference_review, path: output/cover-review.md, mime_type: text/markdown, required: false}
  - {role: failure_state, path: output/failure-state.json, mime_type: application/json, required: false}
  - {role: failure_diagnosis, path: output/failure-diagnosis.md, mime_type: text/markdown, required: false}
