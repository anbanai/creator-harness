id: viral-ip-video-editor
version: 1.3.1
kind: plugin
display_name: 爆款 IP 视频剪辑
description: 基于 Montage 运行时处理真人 IP 口播素材，完成留存导向的剪辑规划、制作指导和成片质量复核；字幕与 BGM 各自按独立方法论制作（BGM 可按章节换曲），封面在流程最后一步生成。
interaction:
  user_questions: false
agent:
  name: viral-ip-video-editor
  claude_source: agent.claude.md
  codex_source: agent.codex.toml
  skills: [content-reuse, content-tagging, montage, portrait-cover-design, short-video-cover, talking-head-video-generation, talking-head-composition, talking-head-visual-focus, talking-head-explainer, video-bgm-design, video-production-qc, video-subtitle-design, viral-ip-editing, wechat-video-account-review, auto-editor]
  max_turns: 250
runtime:
  profile: viral-ip-video-editor
  adapter: openmontage
surfaces: [plugin]
features: [viral-ip-video-editing, retention-editing, explainable-knowledge-editing, generated-video-inserts, semantic-master-variants, retention-experiments, independent-validation, source-assets, montage-runtime, audio-silence-detection]
artifacts:
  - {role: explainer_input_assessment, path: output/explainer-input-assessment.json, mime_type: application/json, required: false}
  - {role: bgm_candidates, path: output/bgm-candidates.json, mime_type: application/json, required: false}
  - {role: semantic_master, path: output/semantic-master.json, mime_type: application/json, required: false}
  - {role: explanation_rehearsal, path: output/explanation-rehearsal.json, mime_type: application/json, required: false}
