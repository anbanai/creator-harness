  - {role: cover_plan, path: output/cover-plan.md, mime_type: text/markdown, required: true}
  - {role: cover_prompt, path: output/cover-prompt.md, mime_type: text/markdown, required: true}
  - {role: cover_reference_prompts, path: output/cover-prompts.md, mime_type: text/markdown, required: false}
  - {role: cover_review, path: output/cover-quality.json, mime_type: application/json, required: true}
