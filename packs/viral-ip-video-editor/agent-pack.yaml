  - {role: platform_variant_plan, path: output/platform-variant-plan.json, mime_type: application/json, required: false}
  - {role: retention_experiment_plan, path: output/retention-experiment-plan.json, mime_type: application/json, required: false}
  - {role: independent_validation_plan, path: output/independent-validation-plan.json, mime_type: application/json, required: true}
  - {role: independent_validation, path: output/independent-validation.json, mime_type: application/json, required: true}
  - {role: retention_results, path: output/retention-results.json, mime_type: application/json, required: false}
