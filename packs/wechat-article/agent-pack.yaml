id: wechat-article
version: 2.0.7
kind: managed
display_name: 微信公众号文章
description: 从选题研究、写作和视觉设计到文章交付物的完整创作流程。
agent:
  name: wechat-article
  claude_source: agent.claude.md
  codex_source: agent.codex.toml
  dsh_source: agent.dsh.yml
  # Keep the standalone interactive publishing skill distributed with the pack;
  # the managed Article Agent itself does not load or invoke it.
  skills: [portrait-cover-design, content-writing, humanizer, article-visual-design, article-cover-design, article-research, trending-topics, trend-rider, topic-evaluator, seo-optimization, article-viral-strategy, article-publishing]
  max_turns: 300
channel: wechat-article
plan_task_kind: content_generation
bindings:
  task_kinds: [content_generation]
runtime:
  profile: wechat-article
  adapter: standard
  max_turns: 60
surfaces: [plugin, task, plan]
features: [image-generation, reference-images]
billing_operations:
  content_generation: task.wechat_article
artifacts:
  - {role: research, path: output/01-research.md, mime_type: text/markdown, required: false}
  - {role: outline, path: output/02-outline.md, mime_type: text/markdown, required: false}
  - {role: draft, path: output/03-article.md, mime_type: text/markdown, required: false}
  - {role: final_markdown, path: output/04-article-final.md, mime_type: text/markdown, required: true}
  - {role: html, path: output/05-article.html, mime_type: text/html, required: true}
  - {role: context, path: output/context-brief.md, mime_type: text/markdown, required: false}
  - {role: quality, path: output/content-quality-report.md, mime_type: text/markdown, required: false}
  - {role: seo, path: output/seo-result.md, mime_type: text/markdown, required: false}
  - {role: visual_plan, path: output/visual-rhythm-plan.md, mime_type: text/markdown, required: false}
  - {role: image_plan, path: output/image-plan.md, mime_type: text/markdown, required: false}
  - {role: cover_plan, path: output/cover-plan.md, mime_type: text/markdown, required: false}
  - {role: cover_prompt, path: output/cover-prompt.md, mime_type: text/markdown, required: false}
  - {role: cover, path: output/cover.png, mime_type: image/png, required: false}
  - {role: cover_exact, path: output/cover-exact.png, mime_type: image/png, required: false}
  - {role: portrait_failure_diagnosis, path: output/failure-diagnosis.md, mime_type: text/markdown, required: false}
  - {role: cover_review, path: output/cover-quality.json, mime_type: application/json, required: false}
  - {role: images, path: output/images.json, mime_type: application/json, required: false}
  - {role: image, path: output/img_*.png, mime_type: image/png, required: false}
  - {role: review, path: output/final-review.md, mime_type: text/markdown, required: false}
  - {role: review, path: output/marketing-scan.json, mime_type: application/json, required: false}
  - {role: viral_audit, path: output/viral-audit.md, mime_type: text/markdown, required: false}
  - {role: other, path: output/draft.json, mime_type: application/json, required: true}
  - {role: failure_state, path: output/failure-state.json, mime_type: application/json, required: false}
  - {role: progress_state, path: output/progress-state.json, mime_type: application/json, required: false}
delivery:
  - {role: final_markdown, path: output/04-article-final.md, mime_type: text/markdown}
  - {role: html, path: output/05-article.html, mime_type: text/html}
  - {role: cover, path: output/cover*.png, mime_type: image/png}
  - {role: image, path: output/img_*.png, mime_type: image/png}
ui:
  renderer: custom:article
