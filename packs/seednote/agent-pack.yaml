id: seednote
version: 2.0.1
kind: managed
display_name: 种草笔记
description: 支持原创、复刻和爆款分析的种草笔记图文创作流程。
agent:
  name: seednote
  claude_source: agent.claude.md
  codex_source: agent.codex.toml
  dsh_source: agent.dsh.yml
  skills: [humanizer, seednote-research, seednote-viral-analysis, seednote-writing, seednote-visual-design]
  max_turns: 20
bindings:
  project_platforms: [seednote]
  task_types: [seednote, viral_analysis]
runtime:
  profile: seednote
  adapter: standard
  max_turns: 20
surfaces: [plugin, project, task, plan]
features: [research, image-generation, reference-images]
billing_operations:
  seednote: task.seednote
  viral_analysis: task.viral_analysis
artifacts:
  - {role: final_markdown, path: output/content.md, mime_type: text/markdown, required: true}
  - {role: image_plan, path: output/image-plan.md, mime_type: text/markdown, required: true}
  - {role: failure_state, path: output/failure-state.json, mime_type: application/json, required: false}
artifacts_by_task_type:
  viral_analysis:
    - {role: analysis, path: output/source-analysis.md, mime_type: text/markdown, required: true}
    - {role: template, path: output/viral-template.json, mime_type: application/json, required: true}
delivery:
  - {role: final_markdown, path: output/content.md, mime_type: text/markdown}
  - {role: cover, path: output/cover.png, mime_type: image/png}
  - {role: image, path: output/image_*.png, mime_type: image/png}
  - {role: tail, path: output/tail.png, mime_type: image/png}
delivery_by_task_type:
  viral_analysis:
    - {role: analysis, path: output/source-analysis.md, mime_type: text/markdown}
    - {role: template, path: output/viral-template.json, mime_type: application/json}
ui:
  renderer: custom:seednote
