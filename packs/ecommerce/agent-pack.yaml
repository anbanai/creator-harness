id: ecommerce
version: 2.0.2
kind: plugin
display_name: 电商素材
description: 基于产品图片生成完整电商文案和视觉素材包。
agent:
  name: ecommerce
  claude_source: agent.claude.md
  codex_source: agent.codex.toml
  skills: [ecommerce-product-analysis, ecommerce-copywriting, humanizer, ecommerce-visual-design, ecommerce-platform-specs]
  max_turns: 120
runtime:
  profile: wechat
  adapter: standard
  max_turns: 90
surfaces: [plugin, project, task]
features: [image-generation, product-assets]
billing_operations:
  ecommerce: task.ecommerce
artifacts:
  - {role: product_bible, path: output/product-bible.md, mime_type: text/markdown, required: true}
  - {role: product_photos, path: output/product-photos.md, mime_type: text/markdown, required: false}
  - {role: copywriting, path: output/copywriting.md, mime_type: text/markdown, required: true}
  - {role: asset_plan, path: output/asset-plan.md, mime_type: text/markdown, required: false}
  - {role: image_prompts, path: output/image-prompts.md, mime_type: text/markdown, required: false}
  - {role: best_refs, path: output/best-refs.md, mime_type: text/markdown, required: false}
  - {role: compliance, path: output/compliance-report.md, mime_type: text/markdown, required: false}
  - {role: manifest, path: output/manifest.json, mime_type: application/json, required: true}
  - {role: compressed_image, path: output/compressed_*.png, mime_type: image/png, required: false}
  - {role: failure_state, path: output/failure-state.json, mime_type: application/json, required: false}
  - {role: progress_state, path: output/progress-state.json, mime_type: application/json, required: false}
delivery:
  - {role: copywriting, path: output/copywriting.md, mime_type: text/markdown}
  - {role: manifest, path: output/manifest.json, mime_type: application/json}
  - {role: main_image, path: output/main_*.png, mime_type: image/png}
  - {role: detail_image, path: output/detail_*.png, mime_type: image/png}
  - {role: cover_image, path: output/cover_*.png, mime_type: image/png}
  - {role: share_image, path: output/share_*.png, mime_type: image/png}
  - {role: sku_image, path: output/sku_*.png, mime_type: image/png}
ui:
  renderer: custom:ecommerce
