id: live-slicer
version: 2.0.2
kind: managed
display_name: 直播切片
description: 从直播视频转写、规划并批量导出短视频切片。
agent:
  name: live-slicer
  claude_source: agent.claude.md
  codex_source: agent.codex.toml
  skills: [live-slice, capcut-draft]
  max_turns: 160
bindings:
  task_types: [live-slicer]
runtime:
  profile: montage
  adapter: standard
  max_turns: 40
surfaces: [plugin]
features: [video-processing, transcription]
artifacts:
  - {role: metadata, path: output/metadata.json, mime_type: application/json, required: false}
  - {role: cover, path: output/cover.jpg, mime_type: image/jpeg, required: false}
  - {role: clip_cover, path: output/cover-*.jpg, mime_type: image/jpeg, required: false}
  - {role: decision_log, path: output/decision-log.md, mime_type: text/markdown, required: false}
  - {role: audio, path: output/audio.mp3, mime_type: audio/mpeg, required: false}
  - {role: analysis, path: output/analysis.json, mime_type: application/json, required: false}
  - {role: tingwu_task, path: output/tingwu-task.json, mime_type: application/json, required: false}
  - {role: invalid_sentences, path: output/invalid-sentences.json, mime_type: application/json, required: false}
  - {role: valid_sentences, path: output/valid-sentences.json, mime_type: application/json, required: false}
  - {role: segments, path: output/segments.json, mime_type: application/json, required: false}
  - {role: subjects, path: output/subjects.json, mime_type: application/json, required: false}
  - {role: subject_completions, path: output/subject-completions.json, mime_type: application/json, required: false}
  - {role: subject_plan, path: output/subject-clip-plan.json, mime_type: application/json, required: false}
  - {role: summary, path: output/summary.md, mime_type: text/markdown, required: true}
  - {role: manifest, path: output/clip-manifest.json, mime_type: application/json, required: true}
  - {role: plan, path: output/clip-plan.json, mime_type: application/json, required: true}
  - {role: clip_results, path: output/clip_results.json, mime_type: application/json, required: false}
  - {role: clip_draft_results, path: output/clip-draft-results.json, mime_type: application/json, required: false}
  - {role: transcript, path: output/transcript.md, mime_type: text/markdown, required: false}
  - {role: export_video, path: output/exports/*.mp4, mime_type: video/mp4, required: false}
  - {role: export_metadata, path: output/exports/*.md, mime_type: text/markdown, required: false}
  - {role: failure_state, path: output/failure-state.json, mime_type: application/json, required: false}
  - {role: progress_state, path: output/progress-state.json, mime_type: application/json, required: false}
delivery:
  - {role: summary, path: output/summary.md, mime_type: text/markdown}
  - {role: manifest, path: output/clip-manifest.json, mime_type: application/json}
  - {role: clip_video, path: output/exports/*.mp4, mime_type: video/mp4}
  - {role: clip_metadata, path: output/exports/*.md, mime_type: text/markdown}
