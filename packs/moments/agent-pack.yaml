id: moments
version: 2.0.1
kind: managed
display_name: 朋友圈素材包
description: 从素材拆解到朋友圈正文、质量复盘和交付的创作流程。
agent:
  name: moments
  claude_source: agent.claude.md
  codex_source: agent.codex.toml
  skills: [moments, humanizer]
  max_turns: 20
bindings:
  project_platforms: [moments]
  task_types: [moments]
runtime:
  profile: article
  adapter: standard
  max_turns: 25
surfaces: [plugin, project, task]
features: [reference-images]
billing_operations:
  moments: task.moments
artifacts:
  - {role: analysis, path: output/material-analysis.md, mime_type: text/markdown, required: true}
  - {role: final_markdown, path: output/content.md, mime_type: text/markdown, required: true}
  - {role: image_prompt, path: output/image-prompts.md, mime_type: text/markdown, required: true}
  - {role: image, path: output/moments-image.png, mime_type: image/png, required: true}
  - {role: review, path: output/quality-review.md, mime_type: text/markdown, required: true}
delivery:
  - {role: final_markdown, path: output/content.md, mime_type: text/markdown}
  - {role: image, path: output/moments-image.png, mime_type: image/png}
ui:
  renderer: custom:moments
