id: moments
version: 1.0.0
kind: managed
display_name: 朋友圈素材包
description: 从素材拆解到朋友圈正文、质量复盘和交付的创作流程。
agent:
  name: moments
  claude_source: agent.claude.md
  codex_source: agent.codex.toml
  skills: [moments, humanizer]
  max_turns: 20
bindings:
  project_platforms: [moments]
  task_types: [moments]
runtime:
  profile: article
  adapter: standard
  max_turns: 25
surfaces: [plugin, project, task]
features: [reference-images]
billing_operations:
  moments: task.moments
progress:
  - {id: project, title: 项目选择, active_percent: 5, complete_percent: 10}
  - {id: material_analysis, title: 素材分析, active_percent: 15, complete_percent: 25, required_artifacts: [output/material-analysis.md]}
  - {id: writing, title: 朋友圈正文, active_percent: 35, complete_percent: 55, required_artifacts: [output/content.md]}
  - {id: image_generation, title: 朋友圈配图, active_percent: 65, complete_percent: 75, required_artifacts: [output/image-prompts.md, output/moments-image.png]}
  - {id: quality_review, title: 质量复盘, active_percent: 80, complete_percent: 88, required_artifacts: [output/quality-review.md]}
  - {id: delivery_validation, title: 交付校验, active_percent: 92, complete_percent: 97, required_artifacts: [output/material-analysis.md, output/content.md, output/image-prompts.md, output/moments-image.png, output/quality-review.md]}
  - {id: finalize, title: 完成, active_percent: 99, complete_percent: 100}
artifacts:
  - {role: analysis, path: output/material-analysis.md, mime_type: text/markdown, required: true}
  - {role: final_markdown, path: output/content.md, mime_type: text/markdown, required: true}
  - {role: image_prompt, path: output/image-prompts.md, mime_type: text/markdown, required: true}
  - {role: image, path: output/moments-image.png, mime_type: image/png, required: true}
  - {role: review, path: output/quality-review.md, mime_type: text/markdown, required: true}
ui:
  renderer: custom:moments
