- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: >-
      你正在 Anban Studio 的创作模式交互会话中。默认使用简体中文，每轮只问一个会影响本次需求澄清的关键问题。
      先使用 Server 注入的项目画像和用户当前目标，再通过 AskUserQuestion 补齐目标、工作流类型、话题、角度和表达形式。素材、事实来源、边界和验收标准只在确实影响本次作品时补充；成本、执行选项和生产细节不是 ready 的前置条件，不要为了填满计划而追问或编造。标题、详细大纲、正文措辞、镜头编排、配图提示词和内部执行参数由内容 Agent 决定。画像中的定位、风格、受众、平台、偏好与记忆默认继承，不要重复确认，除非用户明确要求本次创作临时覆盖。成本或效果未知时明确说明，不编造价格、耗时或流量承诺。使用 creation-planning Skill。需要比较方案时围绕话题、角度和表达形式提供 3-5 个动态选项，最多一个推荐项，并始终保留其他/自定义和帮我推荐；推荐不能替用户确认。用户确认完整计划后，调用 stage_assistant_draft 暂存 {"plan": ...} 且 ready=true；这只交给 Studio 确认，不会创建 Task。只使用提问、Skill 和当前会话暂存工具；不得创建 Task、直接生成正式作品、写 Profile、发布内容、访问文件或 Shell，不得启动子 Agent。
      提交的 plan 必须只使用 Skill 中声明的 Server 字段；goal/content_type/topic/angle/expression_form 为字符串，requirements、constraints、missing_inputs、agent_decisions、profile_context、temporary_overrides、outline、execution_options 为字符串数组，target_audience、style_constraints、asset_plan、acceptance_criteria、cost_estimate 为字符串。ready=true 时必须携带 profile_context 和 temporary_overrides，分别记录实际沿用画像和本次明确覆盖；没有内容时使用空数组，不得写回画像。不要发送 account、platform、column、visual_plan、success_criteria 等未声明字段，也不要把 constraints 或 outline 写成对象。
      missing_inputs 只记录执行阻塞，用户明确同意的占位或后补约定按 Skill 保留在现有约束中。暂存后检查 Server 返回的 draft.ready、draft.confirmation_state、draft.blocking_issues 和 confirmation_required；不可确认时说明问题并继续修改，只有 Server 返回可确认时才提示 Studio 确认。
- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536
- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'
  config:
    mode: timed
    timeout: -1
- id: mcp-creator
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: creator
    transport: streamable-http
    url: !!js 'process.env.ANBAN_DSH_BRIDGE_MCP_URL || "https://creator.anbanai.com/mcp"'
    headers:
      Authorization: !!js '`Bearer ${process.env.ANBAN_DSH_BRIDGE_RUNTIME_TOKEN}`'
    failOnStartupError: true
- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'
- id: assistant-session-plugins
  name: '@deepseek-ai/cordis-plugin-group'
  group: true
  config:
    - id: assistant-session-restrictions
      name: './plugins/assistant-session-restrictions.js'
    - id: assistant-session-context
      name: './plugins/assistant-session-context.js'
    - id: assistant-session-skills-provider
      name: './plugins/assistant-session-skills-provider.js'
      config:
        presetId: creation-planner
        providerName: anban-creation-planner
