id: whiteboard-animation
version: 2.0.4
kind: managed
display_name: 白板动画
description: 根据 SRT 字幕生成分镜、白板手绘场景和最终动画视频。
interaction:
  user_questions: false
agent:
  name: whiteboard-animation
  claude_source: agent.claude.md
  codex_source: agent.codex.toml
  skills: [whiteboard-animation, content-reuse]
  max_turns: 120
channel: whiteboard-animation
bindings:
  project_platforms: [whiteboard-animation]
  task_types: [whiteboard-animation]
  task_kinds: [whiteboard-animation]
runtime:
  profile: whiteboard-animation
  adapter: standard
  max_turns: 120
surfaces: [plugin, task]
features: [subtitle-to-video, image-generation, source-assets]
billing_operations:
  whiteboard-animation: task.whiteboard-animation
artifacts:
  - {role: content_tags, path: output/content-tags.json, mime_type: application/json, required: true}
  - {role: final_video, path: output/final.mp4, mime_type: video/mp4, required: true}
  - {role: storyboard, path: output/storyboard.json, mime_type: application/json, required: true}
  - {role: scene_image, path: output/scenes/*.png, mime_type: image/png, required: true}
  - {role: scene_annotation, path: output/scenes/*.annotation.json, mime_type: application/json, required: true}
  - {role: scene_video, path: output/scenes/*-whiteboard.mp4, mime_type: video/mp4, required: false}
  - {role: scene_preview, path: output/scenes/*-preview.png, mime_type: image/png, required: false}
  - {role: quality_report, path: output/quality-report.json, mime_type: application/json, required: true}
  - {role: delivery_manifest, path: output/delivery-manifest.json, mime_type: application/json, required: true}
  - {role: failure_state, path: output/failure-state.json, mime_type: application/json, required: false}
  - {role: failure_diagnosis, path: output/failure-diagnosis.md, mime_type: text/markdown, required: false}
  - {role: progress_state, path: output/progress-state.json, mime_type: application/json, required: false}
  - {role: reuse_brief, path: output/content-reuse-brief.json, mime_type: application/json, required: false}
  - {role: topic_analysis, path: output/topic-analysis.md, mime_type: text/markdown, required: false}
  - {role: content_lineage, path: output/content-lineage.json, mime_type: application/json, required: false}
delivery:
  - {role: final_video, path: output/final.mp4, mime_type: video/mp4}
  - {role: storyboard, path: output/storyboard.json, mime_type: application/json}
  - {role: scene_image, path: output/scenes/*.png, mime_type: image/png}
  - {role: scene_annotation, path: output/scenes/*.annotation.json, mime_type: application/json}
  - {role: quality_report, path: output/quality-report.json, mime_type: application/json}
  - {role: delivery_manifest, path: output/delivery-manifest.json, mime_type: application/json}
ui:
  renderer: custom:whiteboard-animation
tagging: {enabled: true, profile: generic-content, required_artifact: output/content-tags.json, subject_roles: [final_video], extensions: [presentation_device, funnel_stage]}
