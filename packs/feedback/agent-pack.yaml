id: feedback
version: 1.0.1
kind: plugin
display_name: 反馈分析
description: 周期性分析公众号与种草笔记数据并生成可追溯的反馈证据。
agent:
  name: feedback
  claude_source: agent.claude.md
  codex_source: agent.codex.toml
  skills: [publish-log, data-tracker, publish-analytics, performance-review, content-postmortem, post-scorer, strategy-advisor]
  max_turns: 80
bindings: {}
runtime: {}
surfaces: [plugin]
features: [feedback]
artifacts:
  - {role: analysis_result, path: output/feedback-analysis.json, mime_type: application/json, required: false}
  - {role: evidence, path: output/feedback-evidence.json, mime_type: application/json, required: false}
  - {role: skipped, path: output/feedback-skipped.json, mime_type: application/json, required: false}
  - {role: failure_state, path: output/failure-state.json, mime_type: application/json, required: false}
  - {role: progress_state, path: output/progress-state.json, mime_type: application/json, required: false}
