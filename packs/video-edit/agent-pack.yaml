id: video-edit
version: 1.0.0
kind: managed
display_name: 全自动视频剪辑
description: 使用 browser-use/video-use 自动完成转写、剪辑、字幕和渲染，并交付可复核的成片与编辑证据。
interaction:
  user_questions: false
agent:
  name: video-edit
  claude_source: agent.claude.md
  codex_source: agent.codex.toml
  skills: [project-profile-context, video-edit, content-tagging]
  max_turns: 160
runtime:
  profile: video-edit
  adapter: standard
  max_turns: 160
channel: video-edit
bindings:
  project_platforms: [video-edit]
  task_types: [video-edit]
  task_kinds: [video_edit]
surfaces: [plugin, task]
features: [automatic-video-editing, source-assets, subtitles-on-demand]
billing_operations:
  video_edit: task.video_edit
artifacts:
  - {role: content_tags, path: output/content-tags.json, mime_type: application/json, required: true}
  - {role: final_video, path: output/final.mp4, mime_type: video/mp4, required: true}
  - {role: edit_decision_list, path: output/edit-decision-list.json, mime_type: application/json, required: true}
  - {role: edit_strategy, path: output/edit-strategy.md, mime_type: text/markdown, required: true}
  - {role: delivery_manifest, path: output/delivery-manifest.json, mime_type: application/json, required: true}
  - {role: quality_evidence, path: output/quality-evidence.json, mime_type: application/json, required: true}
  - {role: subtitles, path: output/subtitles.srt, mime_type: application/x-subrip, required: false}
  - {role: failure_state, path: output/failure-state.json, mime_type: application/json, required: false}
  - {role: failure_diagnosis, path: output/failure-diagnosis.md, mime_type: text/markdown, required: false}
  - {role: progress_state, path: output/progress-state.json, mime_type: application/json, required: false}
delivery:
  - {role: content_tags, path: output/content-tags.json, mime_type: application/json}
  - {role: final_video, path: output/final.mp4, mime_type: video/mp4}
  - {role: edit_decision_list, path: output/edit-decision-list.json, mime_type: application/json}
  - {role: edit_strategy, path: output/edit-strategy.md, mime_type: text/markdown}
  - {role: delivery_manifest, path: output/delivery-manifest.json, mime_type: application/json}
  - {role: quality_evidence, path: output/quality-evidence.json, mime_type: application/json}
  - {role: subtitles, path: output/subtitles.srt, mime_type: application/x-subrip}
ui:
  renderer: custom:video-edit
tagging: {enabled: true, profile: generic-content, required_artifact: output/content-tags.json, subject_roles: [final_video], extensions: [presentation_device, funnel_stage]}
