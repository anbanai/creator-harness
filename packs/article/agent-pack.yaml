id: article
version: 2.0.0
kind: managed
display_name: 微信公众号文章
description: 从选题研究、写作和视觉设计到文章交付物的完整创作流程。
agent:
  name: article
  claude_source: agent.claude.md
  codex_source: agent.codex.toml
  dsh_source: agent.dsh.yml
  # Keep the standalone interactive publishing skill distributed with the pack;
  # the managed Article Agent itself does not load or invoke it.
  skills: [content-writing, humanizer, article-visual-design, article-cover-design, topic-research, seo-optimization, article-publishing, article-viral-strategy]
  max_turns: 300
bindings:
  project_platforms: [article]
  task_types: [article]
runtime:
  profile: article
  adapter: standard
  max_turns: 60
surfaces: [plugin, project, task, plan]
features: [image-generation, reference-images]
billing_operations:
  article: task.article
artifacts:
  - {role: final_markdown, path: output/04-article-final.md, mime_type: text/markdown, required: true}
  - {role: html, path: output/05-article.html, mime_type: text/html, required: true}
  - {role: review, path: output/final-review.md, mime_type: text/markdown, required: false}
  - {role: review, path: output/marketing-scan.json, mime_type: application/json, required: false}
  - {role: other, path: output/draft.json, mime_type: application/json, required: true}
delivery:
  - {role: final_markdown, path: output/04-article-final.md, mime_type: text/markdown}
  - {role: html, path: output/05-article.html, mime_type: text/html}
  - {role: cover, path: output/cover*.png, mime_type: image/png}
  - {role: image, path: output/img_*.png, mime_type: image/png}
ui:
  renderer: custom:article
