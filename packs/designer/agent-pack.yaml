id: designer
version: 1.0.0
kind: plugin
display_name: 线稿设计
description: 线稿上色、配色纪律与跨图视觉一致性设计流程。
agent:
  name: designer
  claude_source: agent.claude.md
  codex_source: agent.codex.toml
  skills: [line-art-coloring]
  max_turns: 120
bindings: {}
runtime: {}
surfaces: [plugin]
features: [image-generation, reference-images]
progress:
  - {id: design, title: 视觉设计}
  - {id: delivery, title: 交付验收}
artifacts:
  - {role: color_bible, path: output/color-bible.md, mime_type: text/markdown, required: true}
  - {role: first_image, path: output/colored_00.png, mime_type: image/png, required: true}
  - {role: report, path: output/consistency-report.md, mime_type: text/markdown, required: true}
