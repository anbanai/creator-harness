# Codex subagent registration — append (or merge) into ~/.codex/config.toml
#
# This file is consumed by install-subagents.sh. It registers the Anban Creator
# subagents and enables the multi-agent feature flag.
#
# WARNING: do NOT paste this verbatim if your ~/.codex/config.toml already declares
# any of these tables. Run install-subagents.sh instead — it is idempotent.

[features]
multi_agent = true

[agents]
max_threads = 6

[mcp_servers.creator]
url = "https://creator.anbanai.com/mcp"
bearer_token_env_var = "ANBAN_API_KEY"

[agents.wechat-article]
description = "微信公众号图文全自动创作引擎（选题 → 草稿）"
config_file = "~/.codex/agents/wechat-article.toml"
nickname_candidates = ["Writer", "ArticleBot", "公众号写手"]

[agents.seednote]
description = "种草笔记全自动创作引擎（原创 + 复刻）"
config_file = "~/.codex/agents/seednote.toml"
nickname_candidates = ["NoteBot", "Seeder", "种草机器"]

[agents.moments]
description = "朋友圈素材包全自动创作 Agent（素材拆解 → 正文 → 质量复盘 → 交付）"
config_file = "~/.codex/agents/moments.toml"
nickname_candidates = ["Moments", "朋友圈写手", "PrivateDomain"]

[agents.ecommerce]
description = "电商出图全自动执行引擎（多产品图 → 主图/详情/封面/分享/SKU，保证产品跨图一致）"
config_file = "~/.codex/agents/ecommerce.toml"
nickname_candidates = ["ShopBot", "Merchant", "电商出图师"]

[agents.montage]
description = "视频生成（业务需求 + 素材 → 成片与交付清单）"
config_file = "~/.codex/agents/montage.toml"
nickname_candidates = ["VideoGenerator", "VideoGen", "Montage", "视频生成"]

[agents.hypit]
description = "视频复刻（参考拆解 → 内容替换 → 可编辑工程与成片交付）"
config_file = "~/.codex/agents/hypit.toml"
nickname_candidates = ["VideoReplica", "Hypit", "视频复刻"]

[agents.profile-analysis]
description = "项目级六维账号画像分析并提交数据库结果"
config_file = "~/.codex/agents/profile-analysis.toml"
nickname_candidates = ["Profile Analyst", "画像分析", "Persona Builder"]

[agents.feedback-analysis]
description = "消费服务端反馈任务，生成可追溯的分析证据与策略候选"
config_file = "~/.codex/agents/feedback-analysis.toml"
nickname_candidates = ["Feedback Analyst", "反馈分析", "复盘助手"]

[agents.project-creator]
description = "通过连续对话创建或更新项目，并收集六维账号画像"
config_file = "~/.codex/agents/project-creator.toml"
nickname_candidates = ["Project Creator", "项目创建", "画像访谈"]

[agents.creation-planner]
description = "通过持续对话制定创作计划，并在确认后创建作品任务"
config_file = "~/.codex/agents/creation-planner.toml"
nickname_candidates = ["Creation Planner", "创作计划", "创作助手"]

[agents.postmortem-review]
description = "复盘已完成作品并形成等待独立数据验证的画像改进候选"
config_file = "~/.codex/agents/postmortem-review.toml"
nickname_candidates = ["Postmortem Review", "作品复盘", "复盘助手"]

[agents.wechat-picture]
description = "微信公众号贴图内容、视觉与发布包全自动创作引擎"
config_file = "~/.codex/agents/wechat-picture.toml"
nickname_candidates = ["Newspic", "公众号贴图", "贴图助手"]

[agents.whiteboard-animation]
description = "将 SRT 字幕制作成逐幕白板动画视频并交付文件"
config_file = "~/.codex/agents/whiteboard-animation.toml"
nickname_candidates = ["WhiteboardAnimation", "白板动画"]

[agents.local-life]
description = "根据门店或活动素材批量生成多条短视频变体"
config_file = "~/.codex/agents/local-life.toml"
nickname_candidates = ["素材混剪", "LocalLife", "MixVideo"]

[agents.content-planning]
description = "生成带证据的内容研究、语义验证文章与视频脚本"
config_file = "~/.codex/agents/content-planning.toml"
nickname_candidates = ["Content Planner", "内容研究"]
