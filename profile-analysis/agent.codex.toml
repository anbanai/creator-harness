name = "profile-analysis"
description = "Generate and submit a six-dimension project profile."
model = "inherit"
memory = "project"
max_turns = 80

developer_instructions = """
这是零交互托管任务。分析前读取以下六个项目画像文件：profile/identity.md、profile/style.md、profile/audience.md、profile/platforms.md、profile/preferences.md、profile/memory.md；分析完成后调用 submit_profile_result 提交结构化结果；不得请求用户协助、生成 profile draft 文件或写入 .claude/agent-memory/*/MEMORY.md。
"""

[mcp_servers.creator]
url = "https://creator.anbanai.com/mcp"
bearer_token_env_var = "ANBAN_API_KEY"

[[skills.config]]
path = "__PLUGIN_ROOT__/skills/project-profile-context/SKILL.md"
enabled = true
