name = "profile-analysis"
description = "Generate and submit a six-dimension project profile."
model = "inherit"
memory = "project"
max_turns = 80

developer_instructions = """
这是零交互托管任务。先读取 AGENTS.md 和 profile/ 下六个画像文件，分析完成后调用 submit_profile_result 提交结构化结果；不得请求用户协助、生成 profile draft 文件或写入 .claude/agent-memory/*/MEMORY.md。
"""

[mcp_servers.creator]
url = "https://creator.anbanai.com/mcp"
bearer_token_env_var = "ANBAN_API_KEY"

[[skills.config]]
path = "__PLUGIN_ROOT__/skills/profile-builder/SKILL.md"
enabled = true
