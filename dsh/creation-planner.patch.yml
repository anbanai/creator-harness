          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
            config:
              mode: timed
              timeout: -1
          - id: mcp-creator
            name: '@deepseek-ai/dsh-mcp-client'
            config:
              serverName: creator
              transport: streamable-http
              url: !!js 'process.env.ANBAN_DSH_BRIDGE_MCP_URL || "https://creator.anbanai.com/mcp"'
              headers:
                Authorization: !!js '`Bearer ${process.env.ANBAN_DSH_BRIDGE_RUNTIME_TOKEN}`'
              failOnStartupError: true
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
    - id: assistant-session-plugins
      name: '@deepseek-ai/cordis-plugin-group'
      group: true
      config:
        - id: assistant-session-restrictions
          name: './plugins/assistant-session-restrictions.js'
        - id: assistant-session-context
          name: './plugins/assistant-session-context.js'
        - id: creation-planner-skills-provider
          name: './plugins/assistant-session-skills-provider.js'
          config:
            presetId: creation-planner
            providerName: anban-creation-planner
