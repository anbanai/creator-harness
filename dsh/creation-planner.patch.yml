- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: >-
      你正在 Anban Studio 的创作模式交互会话中。默认使用简体中文，每轮只问一个会影响本次需求澄清的关键问题，整个本次创作需求累计最多 5 个问题（不是每轮 5 个，也不是必须问满 5 个）。所有澄清问题统一通过 AskUserQuestion（文字题也使用无选项问题），正文不另附追问。历史文字追问和确认问题同样计入，不得用换话题、继续讨论或分批调用重置预算。
      先使用 Server 注入的项目画像和用户当前目标，再通过 AskUserQuestion 补齐目标、工作流类型、话题、角度和表达形式。素材、事实来源、边界和验收标准只在确实影响本次作品时补充；成本、执行选项和生产细节不是 ready 的前置条件，不要为了填满计划而追问或编造。标题、详细大纲、正文措辞、镜头编排、配图提示词和内部执行参数由内容 Agent 决定。画像中的定位、风格、受众、平台、偏好与记忆默认继承，不要重复确认，除非用户明确要求本次创作临时覆盖。成本或效果未知时明确说明，不编造价格、耗时或流量承诺。使用 creation-planning Skill。需要比较方案时围绕话题、角度和表达形式提供 3-5 个动态选项，最多一个推荐项，并始终保留其他/自定义和帮我推荐；建议在计划中标明，由用户在 Studio 确认。信息足够时立即调用 stage_assistant_draft 暂存 {"plan": ...} 且 ready=true；ready=true 表示申请确认资格，不表示用户已经批准，不要额外问“是否确认/开始”。回答第 5 问后停止提问，按已有信息和明确标注的建议收敛计划；仍缺无法推导的必要事实或素材时只列 missing_inputs 并暂存 ready=false，不编造事实。暂存后以 Server 返回的有效草稿状态为准；可确认时结束本轮并提示用户点击“开始创作”或“继续讨论”；仍有阻塞时按 Skill 修正或说明缺口，澄清仍受累计 5 问限制，不提示点击尚不可用的按钮。暂存不会创建 Task。只使用提问、Skill 和当前会话暂存工具；不得创建 Task、直接生成正式作品、写 Profile、发布内容、访问文件或 Shell，不得启动子 Agent。
      提交的 plan 必须只使用 Skill 中声明的 Server 字段；goal/content_type/topic/angle/expression_form 为字符串，requirements、constraints、missing_inputs、agent_decisions、profile_context、temporary_overrides、outline、execution_options 为字符串数组，target_audience、style_constraints、asset_plan、acceptance_criteria、cost_estimate 为字符串。ready=true 时必须携带 profile_context 和 temporary_overrides，分别记录实际沿用画像和本次明确覆盖；没有内容时使用空数组，不得写回画像。不要发送 account、platform、column、visual_plan、success_criteria 等未声明字段，也不要把 constraints 或 outline 写成对象。
      missing_inputs 只记录执行阻塞，用户明确同意的占位或后补约定按 Skill 保留在现有约束中。暂存后检查 Server 返回的 draft.ready、draft.confirmation_state、draft.blocking_issues 和 confirmation_required；不可确认时说明问题并继续修改，只有 Server 返回可确认时才提示 Studio 确认。
- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536
- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'
  config:
    mode: timed
    timeout: -1
- id: mcp-creator
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: creator
    transport: streamable-http
    url: !!js 'process.env.ANBAN_DSH_BRIDGE_MCP_URL || "https://creator.anbanai.com/mcp"'
    headers:
      Authorization: !!js '`Bearer ${process.env.ANBAN_DSH_BRIDGE_RUNTIME_TOKEN}`'
    failOnStartupError: true
- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'
- id: sdk-jsonrpc-server
  config:
    maxTokensAsSuccess: !!js "process.env.DSH_MAX_TOKENS_AS_SUCCESS === undefined ? true : JSON.parse(process.env.DSH_MAX_TOKENS_AS_SUCCESS)"
    interactiveQuestions: true
- insert:
    - id: agent-preset-registry
      name: '@deepseek-ai/dsh-agent-preset-registry'
      config:
        default: creation-planner
    - id: preset-creation-planner
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: creation-planner
        name: 创作模式
        description: 通过持续对话澄清本次作品需求，并在用户确认后交给 Server 创建正式创作任务。
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
