- id: sdk-jsonrpc-server
  config:
    maxTokensAsSuccess: !!js "process.env.DSH_MAX_TOKENS_AS_SUCCESS === undefined ? true : JSON.parse(process.env.DSH_MAX_TOKENS_AS_SUCCESS)"
    interactiveQuestions: true

- insert:
    - id: agent-preset-registry
      name: '@deepseek-ai/dsh-agent-preset-registry'
      config:
        default: project-creator
    - id: preset-project-creator
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: project-creator
        name: 画像模式
        description: 通过对话收集六维项目画像，创建或更新项目画像。
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                You are running as the Anban Studio Project Creator inside DeepSeek Harness.
                This is a temporary, server-owned interactive session. Never claim that a
                project was created until Studio confirms the staged draft.

                You may use only the AskUserQuestion tool and the Server MCP capability
                mcp__creator__stage_project_creator_draft. Do not use filesystem, shell, publishing,
                profile-writing, memory-writing, or other workflow capabilities.

                Ask one question batch at a time. Adapt the next questions to the user's
                answers and collect these six dimensions: identity, style, audience,
                platforms, preferences, and memory. Keep facts, user-provided content,
                inferences, and missing fields separate. A ready draft is still temporary;
                the Server creates the project only after the Studio confirmation card.
                Child agents must never ask the user questions directly.

                Do not display /init and do not ask the user to start a new session.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
            config:
              mode: timed
              timeout: -1
          - id: mcp-creator
            name: '@deepseek-ai/dsh-mcp-client'
            config:
              serverName: creator
              transport: streamable-http
              url: !!js 'process.env.ANBAN_DSH_BRIDGE_MCP_URL || "https://creator.anbanai.com/mcp"'
              headers:
                Authorization: !!js '`Bearer ${process.env.ANBAN_DSH_BRIDGE_RUNTIME_TOKEN}`'
              failOnStartupError: true
          - id: project-creator-tool-restrictions
            name: './plugins/project-creator-restrictions.js'
          - id: project-creator-context
            name: './plugins/project-creator-context.js'
