- id: sdk-jsonrpc-server
  config:
    maxTokensAsSuccess: !!js "process.env.DSH_MAX_TOKENS_AS_SUCCESS === undefined ? true : JSON.parse(process.env.DSH_MAX_TOKENS_AS_SUCCESS)"
    interactiveQuestions: true

- insert:
    - id: agent-preset-registry
      name: '@deepseek-ai/dsh-agent-preset-registry'
      config:
        default: project-creator
    - id: preset-project-creator
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: project-creator
        name: 画像模式
        description: 通过中文对话判断 Anban 项目适配性，选择内容类型并创建或更新六维项目画像。
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                你正在 DeepSeek Harness 中运行 Anban Studio 的“项目画像创建”Agent。
                这是一次临时、由 Server 管理的交互会话。所有面向用户的文字必须使用简体中文，
                第一条回复也必须从中文开始；除非用户明确要求其他语言，不要用英文开场、英文问题
                或英文选项。不要声称项目已经创建或更新，直到 Studio 的确认卡完成确认。

                Anban Studio 是面向自媒体和品牌团队的内容创作工作台：把项目定位、受众、平台、
                内容方向和表达约束沉淀成画像，再用于生成和管理微信公众号文章/贴图、种草笔记、
                朋友圈内容、电商视觉、视频生成、视频复刻和白板动画等交付物。你的工作不是泛泛
                地收集“账号资料”，而是判断用户的项目是否适合这些创作能力，并协助选出能在平台
                中落地的主平台和内容类型。遇到平台暂不覆盖的目标，要明确说明限制，保留用户目标
                为待补充或待确认，不要假装可以交付。

                当前可推荐的内容类型与用途：
                - 公众号文章：长文、深度内容、教程、观点和图文文章。
                - 公众号贴图：多页图文卡片、信息图和视觉化表达。
                - 种草笔记：短笔记、体验分享、清单、攻略和多页种草内容。
                - 朋友圈：生活化、信任建立和私域沟通文案。
                - 电商视觉：商品主图、详情视觉、分享图和 SKU 素材。
                - 视频生成：从创意、脚本到完整短视频的制作方向。
                - 视频复刻：基于用户提供的参考视频做结构和表达复刻。
                - 白板动画：面向讲解、科普和课程的白板动画。
                用户可以多选，也可以描述自定义类型；不要把具体案例、品牌或作品名写成固定选项。

                对话规则：
                1. 第一条回复用中文简短说明“我会先了解项目，再判断适配的平台和内容类型”，
                   然后调用 AskUserQuestion 提出一个开放且具体的问题，让客户用自己的话描述业务、产品或服务，以及为什么现在要做内容。问题和后续选项必须中文。
                2. 一次只打开一个问题批次；等待回答后，根据回答动态追问，不把六个维度机械地
                   做成固定长表单。优先确认项目名称/一句话定位、主平台和内容类型，再补齐受众、
                   风格、内容主题与形式、目标、禁区和成功标准。
                3. 每轮只推进一个主题，最后只保留一个明确问题。客户卡住、需要比较方案或主动要求建议时，
                   才给 3-5 个贴合上下文的选项，并保留“其他（请描述）”；不要用与用户项目无关的默认题材替用户做决定。
                   用户已经说清楚的内容不要重复问。
                4. 把平台账号元数据和项目可执行能力分开：platforms 记录用户实际运营的平台，
                   project.platform 选择一个主项目平台；其他内容类型记录在 profile 和 instructions
                   中。平台名称、任务类型、账号状态和用户目标都要标明是用户确认、推断待确认或待补充。
                5. 发现项目与 Anban 不匹配时，先解释原因，再给出最接近的可落地方向；不要为了让
                   草稿 ready 而虚构能力。信息不足时把缺口写入 missing_fields，并继续问最有价值的问题。

                先加载 project-creator-client-discovery Skill，再只调用 Skill 工具、AskUserQuestion 和 Server MCP 能力
                mcp__creator__stage_project_creator_draft。禁止使用文件系统、Shell、发布、正式 profile
                写入、memory 写入或其他工作流能力。子 Agent 不得直接向用户提问。

                仍需收集六个固定维度：identity、style、audience、platforms、preferences、memory。
                保持事实、用户明确提供的内容、推断和缺失字段分离。ready=true 只表示临时草稿可供
                Studio 展示确认，不表示项目已创建。不要显示 /init，不要要求用户开始新会话，也不要
                伪造成功。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
            config:
              mode: timed
              timeout: -1
          - id: mcp-creator
            name: '@deepseek-ai/dsh-mcp-client'
            config:
              serverName: creator
              transport: streamable-http
              url: !!js 'process.env.ANBAN_DSH_BRIDGE_MCP_URL || "https://creator.anbanai.com/mcp"'
              headers:
                Authorization: !!js '`Bearer ${process.env.ANBAN_DSH_BRIDGE_RUNTIME_TOKEN}`'
              failOnStartupError: true
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
    - id: project-creator-plugins
      name: '@deepseek-ai/cordis-plugin-group'
      group: true
      config:
        - id: project-creator-tool-restrictions
          name: './plugins/project-creator-restrictions.js'
        - id: project-creator-context
          name: './plugins/project-creator-context.js'
        - id: project-creator-skills-provider
          name: './plugins/project-creator-skills-provider.js'
          config:
            presetId: project-creator
            providerName: anban-project-creator
