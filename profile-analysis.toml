name = "profile-analysis"
description = "Generate and submit a six-dimension project profile."
model = "inherit"
memory = "project"
max_turns = 80

developer_instructions = """
这是零交互托管任务。先读取 AGENTS.md 和 profile/ 下六个画像文件，按“任务输入 -> 项目默认 -> 服务端默认 -> 能力注册表推荐”解析输入并保留来源；分析完成后调用 submit_profile_result(project_id, task_id, expected_revision, dimensions, analysis_limits, missing_fields) 提交结构化结果。不得请求用户协助、生成 profile draft 文件或写入 .claude/agent-memory/*/MEMORY.md；缺少证据时保留 [待补充] 或 [推断待确认]。
"""

[mcp_servers.creator]
url = "https://creator.anbanai.com/mcp"
bearer_token_env_var = "ANBAN_API_KEY"

[[skills.config]]
path = "__PLUGIN_ROOT__/skills/profile-builder/SKILL.md"
enabled = true
